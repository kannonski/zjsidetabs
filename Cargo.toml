[package]
name = "zjsidetabs"
version = "0.1.0"
edition = "2021"
description = "A super-powered vertical side tab bar for zellij: foldable pane tree, per-program icons, filter/jump, activity rows."
license = "MIT"
repository = "https://github.com/kannonski/zjsidetabs"

[dependencies]
zellij-tile = "0.45.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
